name: Deploy Preview + Lighthouse
on: pull_request

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx vercel@58.7.1 pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@58.7.1 build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: echo "url=$(npx vercel@58.7.1 deploy --prebuilt --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `🔍 Preview: ${url}\n\n(Lighthouse ≥ 95 ×4 se verifica en este mismo workflow.)`,
            });
      # Calienta el edge de Vercel (HTML + chunks + fuentes) antes de medir: el primer hit
      # frío medía cache-miss del CDN y cold start, no la calidad de la página (ADR-0003).
      - name: Calentar CDN
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          for p in /en /es /en/loan-options/fha-loans /es/opciones-de-prestamo/prestamos-fha /en/quote /es/cotizacion /en/contact /es/contacto; do
            curl -s -o /dev/null -w "%{http_code} $p\n" "$URL$p"
          done
          curl -s "$URL/en" | grep -oE '/_next/static/[^"]+' | sort -u | while read -r a; do
            curl -s -o /dev/null "$URL$a"
          done
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: lighthouserc.json
          uploadArtifacts: true
          urls: |
            ${{ steps.deploy.outputs.url }}/en
            ${{ steps.deploy.outputs.url }}/es
            ${{ steps.deploy.outputs.url }}/en/loan-options/fha-loans
            ${{ steps.deploy.outputs.url }}/es/opciones-de-prestamo/prestamos-fha
            ${{ steps.deploy.outputs.url }}/en/quote
            ${{ steps.deploy.outputs.url }}/es/cotizacion
            ${{ steps.deploy.outputs.url }}/en/contact
            ${{ steps.deploy.outputs.url }}/es/contacto
